name: Bash with msys2

on:
  push:
  ##release
  #pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheel for cp${{ matrix.python }}-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Windows
          - os: windows-2019
            python: 37
            platform: win_amd64
          #- os: windows-2019
          #  python: 38
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 39
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 310
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 311
          #  platform: win_amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      #- name: Install rtools 
      #  if: ${{ runner.os == 'Windows' }}
      #  run: |
      #    choco install -y rtools
      #    choco install -y pkgconfiglite

      - name: Setup MSYS
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          pacboy: >-
            toolchain:p
            gcc-fortran:p
            openblas:p
            lapack:p
            fftw:p
            cmake:p
            ninja:p

      - name: Test environments before python
        run: |
          echo 'which gfortran'
          which gfortran
          echo 'which cmake'
          which cmake
          echo 'which python'
          which python
          export PATH=/c/msys64/ucrt64:$PATH
          echo 'which gfortran'
          which gfortran
          echo 'which cmake'
          which cmake
          echo 'which python'
          which python
          #echo 'Find gfortran'
          #find /c/rtools43 -name "*gfortran*"
          #echo 'Find blas'
          #find /c/rtools43 -name "*blas*"
          export CMAKE_PREFIX_PATH=/c/msys64/ucrt64
          export FC=gfortran
          export CC=gcc
          echo 'ls /'
          ls /
          echo 'ls /msys64'
          ls /msys64
          env
          #cmake -S . -B build
          #cmake --build build
          

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9


      - name: Test environments after python
        run: |
          echo 'which python'
          which python
          echo 'which gfortran'
          which gfortran
          echo 'which cmake'
          which cmake
          env
      #- name: Test cmake with python
      #  env: 
      #    FC: gfortran
      #  run: |
      #    cmake -S . -B build -DBUILD_PYTHON=ON
      #    cmake --build build
      #    
      #- name: Build and test wheels
      #  uses: pypa/cibuildwheel@v2.14.0
      #  env:
      #    CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform }}

      - name: Store artifacts
        uses: actions/upload-artifact@v3
        with:
          path: wheelhouse/*.whl

