name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        #os: [ubuntu-20.04, windows-2019, macOS-11]
        os: [windows-latest]

    steps:
      - name: Provide gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          # https://github.com/actions/virtual-environments/issues/2524
          # https://github.com/cbg-ethz/dce/blob/master/.github/workflows/pkgdown.yaml
          sudo ln -s /usr/local/bin/gfortran-12 /usr/local/bin/gfortran
          sudo ln -s /usr/local/bin/gcc-12 /usr/local/bin/gcc
          sudo mkdir /usr/local/gfortran
          sudo ln -s /usr/local/Cellar/gcc@12/*/lib/gcc/12 /usr/local/gfortran/lib
          gfortran --version
          gcc --version
          which gcc
          which gfortran

      - name: Provide fftw  (macOS)
        if: runner.os == 'macOS'
        run: |
          # fftw3 
          brew install fftw
          fftw-wisdom -V

      - name: Install msys (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with: 
           install: >-
             git 
             mingw-w64-x86_64-gcc
             mingw-w64-x86_64-gcc-fortran
             mingw-w64-x86_64-cmake
             mingw-w64-x86_64-ninja
             

      - uses: actions/checkout@v3

      - name: Build binaries
        run: |
             cmake -S . -B build
             cmake --build build
        env:
           FC: gfortran

      - uses: actions/upload-artifact@v3
        with:
          path: ./bin/*
