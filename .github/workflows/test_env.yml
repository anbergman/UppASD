name: Build wheels across platforms

on: [push]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    #defaults:
    #  run:
    #    shell: msys2 {0}
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-2019, windows-latest]

    steps:
      - name: Provide gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make

          pacboy: >-
            toolchain:p
            gcc-fortran:p
            openblas:p
            lapack:p
            fftw:p
            cmake:p
            ninja:p

      - name: Checkout repository
        uses: actions/checkout@v3

      # Used to host cibuildwheel
      - name: Setup python
        uses: actions/setup-python@v4
        with:
            python-version: '3.9'

      - name: Check invironments
        run: |
          echo 'Looking for gfortran'
          which gfortran
          where gfortran
          where gfortran.exe
          (get-command gfortran.exe).Path
          echo 'Looking for gfortran'
          where python
          which python
          (get-command Python.exe).Path
          echo 'PATH:'
          echo $Env:PATH
          echo 'SHELL:'
          echo $Env:SHELL
          echo 'PYTHONHOME'
          echo $Env:PYTHONHOME
          echo 'PYTHONPATH'
          echo $Env:PYTHONPATH
          python --version
          gfortran --version
