name: Build wheels across platforms with msys II

on: [push]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-2019, windows-latest]

    steps:
      - name: Provide gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make

          pacboy: >-
            toolchain:p
            gcc-fortran:p
            openblas:p
            lapack:p
            fftw:p
            cmake:p
            ninja:p

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check invironments
        #env:
        #  pythonLocation: /c/hostedtoolcache/windows/Python/3.9.13/x64
        #  PKG_CONFIG_PATH: /c/hostedtoolcache/windows/Python/3.9.13/x64/lib/pkgconfig
        #  Python_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
        #  Python2_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
        #  Python3_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
        run: |
          echo 'Looking for gfortran'
          which gfortran
          where gfortran
          where gfortran.exe
          echo 'Looking for gfortran'
          where python
          which python
          echo 'PATH:'
          echo $PATH
          echo 'SHELL:'
          echo $SHELL
          echo 'PYTHONHOME'
          echo $PYTHONHOME
          echo 'PYTHONPATH'
          echo $PYTHONPATH
          python --version
          gfortran --version
          echo 'After path'
          #export PATH=/c/hostedtoolcache/windows/Python/3.9.13/x64/:$PATH
          which python
          python --version

      - name: Initiate cibuildwheel
        run: |
          python -m ensurepip
          python -m pip install cibuildwheel pipx
          python -m pipx ensurepath

      - name: Setup venv
        run: |
          echo "Install virtualenv"
          python -m pip install virtualenv
          echo "Create venv"
          python -m venv ~/myenv
          echo 'ls'
          ls
          echo 'ls ~/'
          ls ~/
          echo 'ls ~/myenv'
          ls ~/myenv
          echo 'ls ~/myenv/Scripts'
          ls ~/myenv/Scripts
          echo 'activate'
          which python
          ~/myenv/bin/activate
          echo 'test'
          which python
          python --version
          echo 'Install packages'
          python -m pip install cibuildwheel pipx numpy wheel build

      - name: Run cibuildwheel in venv
        run: |
          echo 'Activate environment'
          ~/myenv/bin/activate
          echo 'run it'
          python -m cibuildwheel --platform windows
          #/c/hostedtoolcache/windows/Python/3.9.13/x64/python -m pipx run cibuildwheel --platform windows
