name: Build wheels across platforms

on: [release]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-2019, windows-latest]

    steps:
      - name: Provide gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make

          pacboy: >-
            toolchain:p
            gcc-fortran:p
            openblas:p
            lapack:p
            fftw:p
            cmake:p
            ninja:p

      - name: Checkout repository
        uses: actions/checkout@v3

      # Used to host cibuildwheel
      - name: Setup python
        uses: actions/setup-python@v3

      - name: Check invironments
        run: |
          where gfortran
          where python
          echo $Env:PATH
          echo $Env:SHELL
          pacman -Q

