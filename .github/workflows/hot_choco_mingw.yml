name: Bash with rtools and mingw

on:
  push:
  ##release
  #pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheel for cp${{ matrix.python }}-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Windows
          - os: windows-2019
            python: 37
            platform: win_amd64
          #- os: windows-2019
          #  python: 38
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 39
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 310
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 311
          #  platform: win_amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup MSYS
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: full
          pacboy: >-
            gcc-fortran:p
            openblas:p
            lapack:p
            fftw:p

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install rtools 
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install -y pkgconfiglite
          choco install -y ninja
          #    choco install -y rtools
          
      - name: Tell distutils to use mingw (Windows)
        if: runner.os == 'Windows'
        #run: |
        #  $pydistutilsConfig = @"
        #  [build]
        #   compiler = mingw32"@
        #  $pydistutilsConfig | Out-File "$env:USERPROFILE\pydistutils.cfg" -Encoding UTF8
        run: |
           echo "[build]" > ~/pydistutils.cfg
           echo "compiler = mingw32" >> ~/pydistutils.cfg 
           echo "" >> ~/pydistutils.cfg 
           echo "[build_ext]" > ~/pydistutils.cfg
           echo "compiler = mingw32" >> ~/pydistutils.cfg 
           echo '==pydistutils.cfg=='
           cat ~/pydistutils.cfg
           echo '==================='
           #echo "[build]" | Out-File -Encoding ASCII ~/pydistutils.cfg
           #echo "compiler=mingw32" | Out-File -Encoding ASCII ~/pydistutils.cfg -Append
           #echo "[build]`ncompiler=mingw32"

      - name: Test cmake without python
        env: 
          FC: gfortran
        run: |
          export CMAKE_PREFIX_PATH='/msys64/mingw64/bin;/c/rtools43/x86_64-w64-mingw32.static.posix'
          #export PATH=/msys64/mingw64/bin:/c/rtools43/x86_64-w64-mingw32.static.posix/bin:$PATH
          export PATH=$(echo "$Python_ROOT_DIR" | sed -E 's/^C:/\/c/; s/\\/\//g'):/c/rtools43/x86_64-w64-mingw32.static.posix/bin:/c/msys64/mingw64/bin:/c/rtools43/x86_64-w64-mingw32.static.posix/bin:$PATH
          echo 'which gfortran'
          which gfortran
          echo 'which cmake'
          which cmake
          echo 'which python'
          which python
          export FC=gfortran
          export CC=gcc
          echo '=================================='
          
      - name: Test cmake with python
        run: |
          which python
          which cmake
          export PYTHON_VERSION=`python -c "import platform;print(platform.python_version())"`
          export CMAKE_PREFIX_PATH='$Python_ROOT_DIR;/c/msys64/mingw64/bin;/c/rtools43/x86_64-w64-mingw32.static.posix'
          export PATH=$(echo "$Python_ROOT_DIR" | sed -E 's/^C:/\/c/; s/\\/\//g'):/c/rtools43/x86_64-w64-mingw32.static.posix/bin:/c/msys64/mingw64/bin:/c/rtools43/x86_64-w64-mingw32.static.posix/bin:$PATH
          export LDFLAGS="-Wl,-rpath=."
          export NPY_DISTUTILS_APPEND_FLAGS=1
          export NPY_WINDOWS_GIT_ACTION_FIX=1
          echo '========================================='
          env
          echo '========================================='
          which python
          which cmake
          pip install setuptools wheel numpy>1.19 
          FC=gfortran CC=gcc cmake -S . -B build -DBUILD_PYTHON=ON -G Ninja -DPYTHON_EXECUTABLE=${Python3_ROOT_DIR}/bin/python
          cmake --build build -v
          
      - name: Build a single wheel
        run: |
          which python
          which cmake
          export PYTHON_VERSION=`python -c "import platform;print(platform.python_version())"`
          export CMAKE_PREFIX_PATH='$Python_ROOT_DIR;/c/msys64/mingw64/bin;/c/rtools43/x86_64-w64-mingw32.static.posix'
          #export PATH=$Python_ROOT_DIR:/c/rtools43/x86_64-w64-mingw32.static.posix/bin:/c/msys64/mingw64/bin:/c/rtools43/x86_64-w64-mingw32.static.posix/bin:$PATH
          export PATH=$(echo "$Python_ROOT_DIR" | sed -E 's/^C:/\/c/; s/\\/\//g'):/c/rtools43/x86_64-w64-mingw32.static.posix/bin:/c/msys64/mingw64/bin:/c/rtools43/x86_64-w64-mingw32.static.posix/bin:$PATH
          export LDFLAGS="-Wl,-rpath=."
          export NPY_DISTUTILS_APPEND_FLAGS=1
          export NPY_WINDOWS_GIT_ACTION_FIX=1
          echo '========================================='
          env
          echo '========================================='
          which python
          which cmake
          python -m pip wheel . -v
          
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v2.14.0
        env:
          CIBW_ENVIRONMENT_WINDOWS: PATH="/c/mingw64/bin;/c/rtools43/x86_64-w64-mingw32.static.posix/bin:$PATH" CMAKE_PREFIX_PATH="/c/rtools43/x86_64-w64-mingw32.static.posix" FC="gfortran" CC="gcc"
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform }}

      - name: Store artifacts
        uses: actions/upload-artifact@v3
        with:
          path: wheelhouse/*.whl

