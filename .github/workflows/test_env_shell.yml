name: Build wheels across platforms with msys

on: [push]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    continue-on-error: true
    strategy:
      matrix:
        os: [windows-2019, windows-latest]

    steps:
      - name: Provide gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make

          pacboy: >-
            toolchain:p
            gcc-fortran:p
            openblas:p
            lapack:p
            fftw:p
            cmake:p
            ninja:p

      - name: Checkout repository
        uses: actions/checkout@v3

      # Used to host cibuildwheel
      - name: Setup python
        uses: actions/setup-python@v4
        with:
            python-version: '3.9'

      - name: Check invironments
        env:
          pythonLocation: /c/hostedtoolcache/windows/Python/3.9.13/x64
          PKG_CONFIG_PATH: /c/hostedtoolcache/windows/Python/3.9.13/x64/lib/pkgconfig
          Python_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python2_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python3_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
        run: |
          echo 'Looking for gfortran'
          which gfortran
          where gfortran
          where gfortran.exe
          echo 'Looking for gfortran'
          where python
          which python
          echo 'PATH:'
          echo $PATH
          echo 'SHELL:'
          echo $SHELL
          echo 'PYTHONHOME'
          echo $PYTHONHOME
          echo 'PYTHONPATH'
          echo $PYTHONPATH
          python --version
          gfortran --version
          echo 'After path'
          export PATH=/c/hostedtoolcache/windows/Python/3.9.13/x64/:$PATH
          which python
          python --version

      - name: Initiate cibuildwheel
        env:
          pythonLocation: /c/hostedtoolcache/windows/Python/3.9.13/x64
          PKG_CONFIG_PATH: /c/hostedtoolcache/windows/Python/3.9.13/x64/lib/pkgconfig
          Python_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python2_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python3_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
        run: |
          export PATH=/c/hostedtoolcache/windows/Python/3.9.13/x64/:$PATH
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python -m ensurepip
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python -m pip install cibuildwheel pipx
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python -m pipx ensurepath

      - name: Setup venv
        env:
          pythonLocation: /c/hostedtoolcache/windows/Python/3.9.13/x64
          PKG_CONFIG_PATH: /c/hostedtoolcache/windows/Python/3.9.13/x64/lib/pkgconfig
          Python_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python2_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python3_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
        run: |
          export PATH=/c/hostedtoolcache/windows/Python/3.9.13/x64/:$PATH
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python -m ensurepip
          echo "Install virtualenv"
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python -m pip install virtualenv
          echo "Create venv"
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python -m venv ~/myenv
          echo 'ls'
          ls
          echo 'ls ~/'
          ls ~/
          echo 'ls ~/myenv'
          ls ~/myenv
          echo 'ls ~/myenv/Scripts'
          ls ~/myenv/Scripts
          echo 'activate'
          ~/myenv/Scripts/activate
          echo 'test'
          python --version
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python --version

      - name: Run cibuildwheel in venv
        env:
          pythonLocation: /c/hostedtoolcache/windows/Python/3.9.13/x64
          PKG_CONFIG_PATH: /c/hostedtoolcache/windows/Python/3.9.13/x64/lib/pkgconfig
          Python_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python2_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          Python3_ROOT_DIR: /c/hostedtoolcache/windows/Python/3.9.13/x64
          PYTHONPATH: /c/hostedtoolcache/windows/Python/3.9.13/x64
          PYTHONHOME: /c/hostedtoolcache/windows/Python/3.9.13/x64
        run: |
          export PATH=/c/hostedtoolcache/windows/Python/3.9.13/x64/:$PATH
          which pipx
          echo 'run it'
          /c/hostedtoolcache/windows/Python/3.9.13/x64/python -m pipx run cibuildwheel --platform windows
