name: Powershell build

on:
  push:
  ##release
  #pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheel for cp${{ matrix.python }}-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Windows
          - os: windows-2019
            python: 37
            platform: win_amd64
          #- os: windows-2019
          #  python: 38
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 39
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 310
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 311
          #  platform: win_amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install rtools 
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install -y rtools
          choco install -y pkgconfiglite

      - name: Test cmake without python
        env: 
          FC: gfortran
        run: |
          which gfortran
          echo 'C:\ProgramData\chocolatey'
          ls C:\ProgramData\chocolatey
          echo 'C:\ProgramData\chocolatey\lib'
          ls C:\ProgramData\chocolatey\lib

          #cmake -S . -B build
          #cmake --build build
          
      #- name: Test cmake with python
      #  env: 
      #    FC: gfortran
      #  run: |
      #    cmake -S . -B build -DBUILD_PYTHON=ON
      #    cmake --build build
      #    
      #- name: Build and test wheels
      #  uses: pypa/cibuildwheel@v2.14.0
      #  env:
      #    CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform }}

      - name: Store artifacts
        uses: actions/upload-artifact@v3
        with:
          path: wheelhouse/*.whl

