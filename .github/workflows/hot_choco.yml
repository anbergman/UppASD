name: Powershell build

on:
  push:
  ##release
  #pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheel for cp${{ matrix.python }}-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Windows
          - os: windows-2019
            python: 37
            platform: win_amd64
          #- os: windows-2019
          #  python: 38
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 39
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 310
          #  platform: win_amd64
          #- os: windows-2019
          #  python: 311
          #  platform: win_amd64

    steps:
      #- name: Checkout repository
      #  uses: actions/checkout@v3

      #- name: Setup Python
