      #    python-version: 3.9

      #- name: Install rtools 
      #  if: ${{ runner.os == 'Windows' }}
      #  run: |
      #    choco install -y rtools
      #    choco install -y pkgconfiglite

      - name: Test cmake without python
        env: 
          FC: gfortran
        run: |
          echo 'which gfortran'
          which gfortran
          echo 'which cmake'
          which cmake
          echo 'Looking for R-tools'
          ls /c/
          echo 'Looking in rtools43'
          ls /c/rtools43
          echo 'Looking in rtools43/usr/bin'
          ls /c/rtools43/usr/bin
          echo 'Looking in rtools43/ucrt64'
          ls /c/rtools43/ucrt64
          echo "FC=gfortran" >> $env:GITHUB_ENV
          echo "PLAT=x86_64" >> $env:GITHUB_ENV
          echo "MSYSTEM=UCRT64" >> $env:GITHUB_ENV
          echo 'ENV'
          env
          echo 'Find gfortran"
          find /c/rtools43PATH/usr/bin -name "*gfortran*"
          echo 'Find blas"
          find /c/rtools43PATH/usr/bin -name "*blas*"
          #cmake -S . -B build
          #cmake --build build
          
      #- name: Test cmake with python
      #  env: 
      #    FC: gfortran
      #  run: |
      #    cmake -S . -B build -DBUILD_PYTHON=ON
