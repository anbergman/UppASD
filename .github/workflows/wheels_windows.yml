name: Build wheels on windows using only MSYS

#on: [release]
on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    continue-on-error: true
    strategy:
      matrix:
        os: [ windows-2019 ]
        #os: [ubuntu-20.04, windows-2019, macOS-11]

    steps:
      - name: Provide gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          # https://github.com/actions/virtual-environments/issues/2524
          # https://github.com/cbg-ethz/dce/blob/master/.github/workflows/pkgdown.yaml
          sudo ln -s /usr/local/bin/gfortran-12 /usr/local/bin/gfortran
          sudo ln -s /usr/local/bin/gcc-12 /usr/local/bin/gcc
          sudo mkdir /usr/local/gfortran
          sudo ln -s /usr/local/Cellar/gcc@12/*/lib/gcc/12 /usr/local/gfortran/lib
          gfortran --version
          gcc --version
          which gcc
          which gfortran

      - name: Provide fftw  (macOS)
        if: runner.os == 'macOS'
        run: |
          # fftw3 
          brew install fftw
          fftw-wisdom -V

      - name: Provide gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: full
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
          #git
          #make

      - name: Tell distutils to use mingw (Windows)
        if: runner.os == 'Windows'
        run: |
           echo "[build]" > ~/pydistutils.cfg
           echo "compiler = mingw32" >> ~/pydistutils.cfg 
           echo "" >> ~/pydistutils.cfg 
           echo "[build_ext]" > ~/pydistutils.cfg
           echo "compiler = mingw32" >> ~/pydistutils.cfg 

      - name: Checkout repository
        uses: actions/checkout@v3

      # Used to host cibuildwheel
      #- uses: actions/setup-python@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Run CMAKE
        run: |
          echo '================='
          which python
          which gfortran
          which cmake
          echo '================='
          export PATH=$Python_ROOT_DIR:/c/msys64/mingw64/bin:/c/msys64/mingw64/lib:$PATH
          export CMAKE_PREFIX_PATH="/c/msys64/mingw64/share/cmake/OpenBLAS/;/c/msys64/mingw64/share/cmake/;/c/msys64/mingw64/lib/cmake"
          #export CMAKE_PREFIX_PATH='$Python_ROOT_DIR;/c/msys64/mingw64/bin;/c/msys64/mingw64/lib;/c/msys64/mingw64/share/cmake'
          export NPY_DISTUTILS_APPEND_FLAGS=1
          echo '================='
          which python
          which gfortran
          which cmake
          echo '================='
          #$Env:PATH += ';C:\msys64\mingw64\bin'
          #$Env:PATH += ';C:\msys64\mingw64\lib'
          #$Env:PATH += ';C:\msys64\mingw64\include'
          FC=gfortran CC=gcc cmake -S . -B build  -DBUILD_PYTHON=ON -G Ninja
          cmake --build build --verbose
        # to supply options, put them in 'env', like:
        # env:
        #   CIBW_SOME_OPTION: value
        env:
          CMAKE_PREFIX_PATH: "/c/msys64/mingw64"
          CC: gcc
          CXX: g++
          FC: gfortran 
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          #CIBW_SKIP: pp38-manylinux*
          #CIBW_SKIP: pp39* pp31*
          #CIBW_ENVIRONMENT_WINDOWS: >
          #  PATH="$PATH;C:\\\\msys64\\mingw64\\bin"
          #CIBW_ENVIRONMENT_WINDOWS: >
          #CMAKE_PREFIX_PATH="C:\\\\msys64\\mingw64" CC=gcc CXX=g++ FC=gfortran 
          #CIBW_ENVIRONMENT_WINDOWS: CC=gcc CXX=g++ FC=gfortran

      - name: Install cibuildwheel
        run: |
          python -m ensurepip 
          python -m pip install cibuildwheel==2.10.1


      - name: Build wheels
        run: |
          export PATH=$Python_ROOT_DIR:/c/msys64/mingw64/bin:/c/msys64/mingw64/lib:$PATH
          #$Env:PATH += ';C:\msys64\mingw64\bin'
          #$Env:PATH += ';C:\msys64\mingw64\lib'
          #$Env:PATH += ';C:\msys64\mingw64\include'
          python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        # env:
        #   CIBW_SOME_OPTION: value
        env:
          #CIBW_SKIP: pp38-manylinux*
          #CIBW_SKIP: pp39* pp31*
          #CIBW_ENVIRONMENT_WINDOWS: >
          #  PATH="$PATH;C:\\\\msys64\\mingw64\\bin"
          CIBW_ENVIRONMENT_WINDOWS: >
           CMAKE_PREFIX_PATH="C:\\msys64\\mingw64" CC=gcc CXX=g++ FC=gfortran 
          #CMAKE_PREFIX_PATH="C:\\\\msys64\\mingw64" CC=gcc CXX=g++ FC=gfortran 
          #CIBW_ENVIRONMENT_WINDOWS: CC=gcc CXX=g++ FC=gfortran
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""



      - uses: actions/upload-artifact@v3
        with:
          path: ./wheelhouse/*.whl
